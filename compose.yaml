name: devbox-gateway-kvm

services:
  ldap:
    build:
      context: .
      target: ldap
    image: devbox-gateway-kvm:ldap
    restart: unless-stopped
    volumes:
      - ldap-tls:/app/config
      - ldap-ca:/ldap-ca

  gateway:
    build:
      context: .
      target: runtime
    image: devbox-gateway-kvm:local
    platform: linux/amd64
    depends_on:
      ldap:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:?Run ./docker/configure.sh to detect the host KVM group}"
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8443}:8443"
    volumes:
      - gateway-state:/var/lib/gokvm
      - ldap-ca:/etc/gokvm/ldap:ro
    command:
      - serve
      - -state
      - /var/lib/gokvm
      - -listen
      - 0.0.0.0:8443
      - -public-address
      - ${GATEWAY_HOST:-localhost}:${GATEWAY_PORT:-8443}
      - -acme=${GATEWAY_ACME:-false}
      - -acme-email
      - "${GATEWAY_ACME_EMAIL:-}"
      - -acme-ca
      - "${GATEWAY_ACME_CA:-production}"
      - -ldap-url
      - ldaps://ldap:389
      - -ldap-base-dn
      - dc=glauth,dc=com
      - -ldap-domain
      - example.com
      - -ldap-filter
      - (mail=%s)
      - -ldap-username-attribute
      - mail
      - -ldap-required-group
      - ou=team10_r,ou=groups,dc=glauth,dc=com
      - -ldap-admin-group
      - devbox-admins
      - -ldap-ca
      - /etc/gokvm/ldap/cert.pem
      - -encoder
      - ${GATEWAY_ENCODER:-auto}
      - -cpus
      - "${GATEWAY_CPUS:-2}"
      - -memory
      - "${GATEWAY_MEMORY:-4096}"
      - -max-running
      - "${GATEWAY_MAX_RUNNING:-4}"

volumes:
  gateway-state:
  ldap-tls:
  ldap-ca:
