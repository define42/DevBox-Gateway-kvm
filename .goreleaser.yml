version: 2

project_name: DevBox-Gateway-kvm

builds:
- binary: devbox-kvm
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  goarch:
  - amd64
  flags:
  - -trimpath

archives:
- formats: [tar.gz]
  files:
  - LICENSE
  - LICENSE-OpenH264
  - LICENSE-go.264
  - internal/qcow2import/LICENSE
  - README.md
  - CONTRIBUTING.md
  - llms.txt
  - docs/**

checksum:
  name_template: checksums.txt

release:
  name_template: 'Release {{ .Tag }}'
  # Keep all assets private until the workflow has completed every upload.
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  # The date/time/SHA suffix identifies a normal release, not a prerelease.
  prerelease: false
  make_latest: false
  header: |
    DevBox-Gateway-kvm built from commit `{{ .FullCommit }}`.

    The Linux amd64 archive includes a static `devbox-kvm` binary with the
    bundled pure Go H.264 encoder and Go QCOW2 image import. Install OVMF on
    the host for gateway use.

    The container includes the static Go application, OVMF, and CA certificates:
    ```sh
    docker pull {{ .Env.RELEASE_IMAGE }}:{{ .Tag }}
    ```
    The matching Compose LDAP image is
    `{{ .Env.RELEASE_IMAGE }}-ldap:{{ .Tag }}`.
    See the [Docker guide](https://github.com/{{ .Env.GITHUB_REPOSITORY }}/blob/{{ .Tag }}/docs/docker.md)
    for KVM access, LDAP, TLS, and persistent storage setup.
