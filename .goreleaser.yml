version: 2

project_name: DevBox-Gateway-kvm

builds:
- binary: devbox-kvm
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  goarch:
  - amd64
  flags:
  - -trimpath
  ldflags:
  - -s -w
  - -X github.com/define42/DevBox-Gateway-kvm/internal/buildinfo.releaseVersion={{ .Version }}
  - -X github.com/define42/DevBox-Gateway-kvm/internal/buildinfo.releaseCommit={{ .FullCommit }}
  - -X github.com/define42/DevBox-Gateway-kvm/internal/buildinfo.releaseBuildDate={{ .Date }}

# Native packages are the only distributable binaries. The Linux override
# suppresses both archives and standalone binary uploads.
archives:
- format_overrides:
  - goos: linux
    formats: [none]

nfpms:
- id: native
  package_name: devbox-kvm
  file_name_template: '{{ .ConventionalFileName }}'
  vendor: define42
  homepage: https://github.com/define42/DevBox-Gateway-kvm
  maintainer: define42 <define42@users.noreply.github.com>
  description: |-
    Self-hosted Linux desktop gateway with a pure Go KVM runtime.
    Includes the web dashboard, LDAP authentication, RDP, H.264 and UEFI firmware.
    Managed desktops require Linux 6.12+ with Landlock ABI 6 and cgroup v2.
  license: MIT
  formats: [deb, rpm]
  bindir: /usr/bin
  section: admin
  priority: optional
  contents:
  - src: packaging/systemd/devbox-kvm.service
    dst: /usr/lib/systemd/system/devbox-kvm.service
    file_info:
      mode: 0644
  - src: packaging/start-service.sh
    dst: /usr/libexec/devbox-kvm/start-service
    file_info:
      mode: 0755
  - src: packaging/configure-firewall.sh
    dst: /usr/libexec/devbox-kvm/configure-firewall
    file_info:
      mode: 0755
  - src: packaging/devbox-kvm.env
    dst: /etc/devbox-kvm/devbox-kvm.env
    type: config|noreplace
    file_info:
      mode: 0600
  - src: LICENSE
    dst: /usr/share/doc/devbox-kvm/LICENSE
  - src: LICENSE-OpenH264
    dst: /usr/share/doc/devbox-kvm/LICENSE-OpenH264
  - src: LICENSE-go.264
    dst: /usr/share/doc/devbox-kvm/LICENSE-go.264
  - src: internal/qcow2import/LICENSE
    dst: /usr/share/doc/devbox-kvm/LICENSE-go-qcow2reader
  - src: internal/gateway/firmware/LICENSE
    dst: /usr/share/doc/devbox-kvm/LICENSE-OVMF
  - src: README.md
    dst: /usr/share/doc/devbox-kvm/README.md
  - src: docs/packages.md
    dst: /usr/share/doc/devbox-kvm/packages.md
  - src: docs/configuration.md
    dst: /usr/share/doc/devbox-kvm/configuration.md
  scripts:
    preinstall: packaging/scripts/preinstall.sh
    postinstall: packaging/scripts/postinstall.sh
    preremove: packaging/scripts/preremove.sh
    postremove: packaging/scripts/postremove.sh
  overrides:
    deb:
      dependencies:
      - ca-certificates
      - systemd (>= 254)
      - passwd
      - libc-bin
      - coreutils
      - grep
      - util-linux
    rpm:
      dependencies:
      - ca-certificates
      - systemd >= 254
      - shadow-utils
      - glibc-common
      - coreutils
      - grep
      - util-linux

checksum:
  name_template: checksums.txt

release:
  name_template: 'Release {{ .Tag }}'
  # Keep all assets private until the workflow has completed every upload.
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  # The date/time/SHA suffix identifies a normal release, not a prerelease.
  prerelease: false
  make_latest: false
  header: |
    DevBox-Gateway-kvm built from commit `{{ .FullCommit }}`.

    Install the Linux amd64 DEB or RPM package for a static `devbox-kvm` binary,
    systemd service, and configuration template. H.264 and OVMF firmware are
    bundled; no host Go toolchain or OVMF package is required.

    Configure `/etc/devbox-kvm/devbox-kvm.env`, then enable and start
    `devbox-kvm.service`. The service prepares its private VM cgroup delegation.
    See the [package installation guide](https://github.com/{{ .Env.GITHUB_REPOSITORY }}/blob/{{ .Tag }}/docs/packages.md)
    for host requirements, authentication, TLS, and upgrades.
