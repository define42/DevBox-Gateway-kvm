# Optional: docker compose -f compose.yaml -f compose.nvidia.yaml up --build -d
services:
  gateway:
    runtime: nvidia
    environment:
      # Include graphics when also enabling guest OpenGL on the NVIDIA GPU.
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
