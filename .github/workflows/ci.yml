name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: ['1.26.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm qemu-utils libmnl-dev genext2fs util-linux iproute2
        sudo chmod 666 /dev/kvm

    - name: Display system information
      run: |
        echo "=== CPU Information ==="
        lscpu | grep -E "Model name|CPU\(s\)|Flags"
        echo ""
        echo "=== Kernel Version ==="
        uname -r
        echo ""
        echo "=== Kernel Boot Parameters ==="
        cat /proc/cmdline
        echo ""
        echo "=== KVM Support ==="
        if [ -e /dev/kvm ]; then
          ls -l /dev/kvm
          echo "KVM is available"
        else
          echo "KVM is NOT available"
        fi

    - name: Install test coverage tools
      run: |
        go install github.com/mattn/goveralls@latest

    - name: Build DevBox-Gateway-kvm
      env:
        GOFLAGS: "-buildvcs=false"
      run: make gokvm

    - name: Run tests (iteration 1/10 with lint and coverage)
      env:
        GOFLAGS: "-buildvcs=false"
      run: make test

    - name: Run stability tests (iterations 2-10)
      env:
        GOFLAGS: "-buildvcs=false"
      run: |
        for i in $(seq 2 10); do
          echo "=== Test iteration $i/10 ==="
          go clean -testcache
          unshare --user --net --map-root-user \
            sh -c 'ip link set lo up && exec "$@"' sh \
            go test -timeout 30m ./...
          echo "=== Iteration $i/10 passed ==="
        done

    - name: Upload coverage to Coveralls
      if: matrix.go-version == '1.26.x'
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: goveralls -service=github -coverprofile c.out

    - name: Clean up
      if: always()
      run: make clean

  test-avc:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
    - name: Install AVC decoder and optional NVENC build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg pkg-config libavcodec-dev libavutil-dev
    - name: Build bundled pure-Go AVC without cgo
      env:
        CGO_ENABLED: '0'
      run: go build ./...
    - name: Test bundled pure-Go AVC and RDP without cgo
      env:
        CGO_ENABLED: '0'
      run: go test -short ./internal/rdp/... ./internal/virtio ./internal/vmm ./internal/flag
    - name: Build and test optional NVENC backend without a GPU
      env:
        CGO_ENABLED: '1'
      run: |
        go build -tags nvenc ./...
        go test -short -tags nvenc ./internal/rdp/... ./internal/virtio ./internal/vmm ./internal/flag
    - name: Check AVC and RDP concurrency
      run: |
        go test -race ./internal/audio
        go test -race ./internal/rdp/...
        go test -race ./internal/virtio ./internal/vmm -run 'Test(RDP|GPU|MultiDisplay|Audio|Sound|Modern|Framebuffer|SerialMirror)'

  release-check:
    name: Check release configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Test date-based versions
      run: bash .github/scripts/release-version-test.sh
    - name: Validate GitHub Actions
      # GitHub supports queue:max; actionlint's schema does not yet include it.
      run: >-
        go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        -ignore 'unexpected key "queue" for "concurrency" section'
    - name: Validate GoReleaser configuration
      uses: goreleaser/goreleaser-action@v7
      with:
        version: v2.18.3
        args: check

  release:
    runs-on: ubuntu-24.04
    needs: [test, test-avc, release-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    # Queue releases instead of replacing pending commits when pushes overlap.
    concurrency:
      group: releases-${{ github.repository }}
      cancel-in-progress: false
      queue: max

    steps:
    - name: Checkout the tested commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Compute date-based release version
      id: version
      shell: bash
      run: |
        tag=$(bash .github/scripts/release-version.sh "$GITHUB_SHA")
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        printf 'tag=%s\nimage=%s\n' "$tag" "$image" >> "$GITHUB_OUTPUT"

    - name: Check whether this commit is already published
      id: existing
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      shell: bash
      run: |
        if draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
          --jq '.draft' 2> "$RUNNER_TEMP/release-error"); then
          if [ "$draft" = false ]; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
        elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-error"; then
          cat "$RUNNER_TEMP/release-error" >&2
          exit 1
        fi

    - name: Set up Go
      if: steps.existing.outputs.published != 'true'
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Create or reuse the commit's release tag
      if: steps.existing.outputs.published != 'true'
      env:
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      shell: bash
      run: |
        if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
        else
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
        fi
        git push origin "refs/tags/$RELEASE_TAG"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push gateway container
      if: steps.existing.outputs.published != 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        target: runtime
        platforms: linux/amd64
        push: true
        tags: |
          ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
          ${{ steps.version.outputs.image }}:${{ github.sha }}
        labels: |
          org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=gateway
        cache-to: type=gha,scope=gateway,mode=max

    - name: Build and push LDAP container
      if: steps.existing.outputs.published != 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        target: ldap
        platforms: linux/amd64
        push: true
        tags: |
          ${{ steps.version.outputs.image }}-ldap:${{ steps.version.outputs.tag }}
          ${{ steps.version.outputs.image }}-ldap:${{ github.sha }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=ldap
        cache-to: type=gha,scope=ldap,mode=max

    - name: Build binary archive and upload draft release
      if: steps.existing.outputs.published != 'true'
      uses: goreleaser/goreleaser-action@v7
      with:
        version: v2.18.3
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}
        RELEASE_IMAGE: ${{ steps.version.outputs.image }}

    - name: Publish completed release
      if: steps.existing.outputs.published != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      run: gh release edit "$RELEASE_TAG" --draft=false --latest=false

    - name: Promote the current main commit to latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
        RELEASE_IMAGE: ${{ steps.version.outputs.image }}
      shell: bash
      run: |
        # Reruns of older commits must not replace a newer latest release.
        git fetch --no-tags origin refs/heads/main
        if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
          echo 'A newer commit is on main; keeping the existing latest release.'
          exit 0
        fi
        for image in "$RELEASE_IMAGE" "$RELEASE_IMAGE-ldap"; do
          docker buildx imagetools create --tag "$image:latest" "$image:$RELEASE_TAG"
        done
        gh release edit "$RELEASE_TAG" --latest
