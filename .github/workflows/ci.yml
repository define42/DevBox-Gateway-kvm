name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

env:
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: ['1.26.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-utils util-linux iproute2 ovmf \
          build-essential binutils gnu-efi dosfstools mtools
        sudo chmod 666 /dev/kvm

    - name: Display system information
      run: |
        echo "=== CPU Information ==="
        lscpu | grep -E "Model name|CPU\(s\)|Flags"
        echo ""
        echo "=== Kernel Version ==="
        uname -r
        echo ""
        echo "=== Kernel Boot Parameters ==="
        cat /proc/cmdline
        echo ""
        echo "=== KVM Support ==="
        if [ -e /dev/kvm ]; then
          ls -l /dev/kvm
          echo "KVM is available"
        else
          echo "KVM is NOT available"
        fi

    - name: Install test coverage tools
      run: |
        go install github.com/mattn/goveralls@latest

    - name: Build DevBox-Gateway-kvm
      env:
        GOFLAGS: "-buildvcs=false"
      run: make devbox-kvm

    - name: Run filesystem permission tests as the unprivileged runner
      env:
        GOFLAGS: "-buildvcs=false"
      # The coverage and stability runs use a user namespace mapped to root.
      run: |
        test "$(id -u)" -ne 0
        go test -count=1 -timeout=2m ./internal/gateway \
          -run '^TestManager(RejectsUnsafeLegacyDiskCapacity|DeleteCleanupFailureDoesNotBlockRestart)$'

    - name: Run tests (iteration 1/10 with lint and coverage)
      env:
        GOFLAGS: "-buildvcs=false"
      run: make test

    - name: Test image normalization and full disk capacity
      env:
        CGO_ENABLED: "0"
        GOMAXPROCS: "4"
      run: |
        go test -tags=integration -count=1 -timeout=2m ./internal/gateway \
          -run '^TestImageCatalog(NormalizesCompressedQCOW2|NormalizesQCOW2Layouts|ImportedQCOW2SupportsFullCapacity)$'

    - name: Run stability tests (iterations 2-10)
      env:
        GOFLAGS: "-buildvcs=false"
      run: |
        for i in $(seq 2 10); do
          echo "=== Test iteration $i/10 ==="
          unshare --user --net --map-root-user \
            sh -c 'ip link set lo up && exec "$@"' sh \
            go test -count=1 -timeout 30m ./...
          make test-qcow2
          echo "=== Iteration $i/10 passed ==="
        done

    - name: Test network overload recovery and worker confinement
      env:
        CGO_ENABLED: "1"
        GOMAXPROCS: "4"
      run: |
        go test -race -tags=integration -count=1 -timeout=2m \
          ./internal/usernet ./internal/workersandbox \
          -run 'Test(NetworkMalformedFloodRecovery|NetworkConnectionSaturationRecovery|WorkerConfinement|ConfinedKVMLifecycle)$'

    - name: Upload coverage to Coveralls
      if: matrix.go-version == '1.26.x'
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: goveralls -service=github -coverprofile c.out

    - name: Clean up
      if: always()
      run: make clean

  test-dashboard:
    name: Test dashboard behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Check dashboard and admin JavaScript syntax
      run: |
        node --check internal/gateway/dashboard.js
        node --check internal/gateway/admin.js
    - name: Test dashboard and admin behavior
      run: node --test internal/gateway/dashboard.test.cjs internal/gateway/admin.test.cjs

  test-avc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
    - name: Install independent AVC decoder and race-test compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg build-essential
    - name: Build bundled pure-Go AVC without cgo
      env:
        CGO_ENABLED: '0'
      run: go build ./...
    - name: Test bundled pure-Go AVC and RDP without cgo
      env:
        CGO_ENABLED: '0'
      run: go test -short ./internal/rdp/... ./internal/virtio ./internal/vmm ./internal/flag
    - name: Check AVC and RDP concurrency
      env:
        CGO_ENABLED: "1"
      run: |
        go test -race ./internal/audio
        go test -race ./internal/rdp/...
        go test -race ./internal/virtio ./internal/vmm -run 'Test(RDP|GPU|MultiDisplay|Audio|Sound|Modern|Framebuffer|SerialMirror|Blk)'
        go test -race -tags=integration -count=1 ./internal/virtio -run '^TestRDPDisplayAudio'

  release-check:
    name: Check release configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Test date-based versions
      run: bash .github/scripts/release-version-test.sh
    - name: Validate GitHub Actions
      # GitHub supports queue:max; actionlint's schema does not yet include it.
      run: >-
        go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        -ignore 'unexpected key "queue" for "concurrency" section'
    - name: Test native package lifecycle
      run: bash packaging/scripts-test.sh
    - name: Validate GoReleaser configuration
      uses: goreleaser/goreleaser-action@v7
      with:
        version: v2.18.3
        args: check
    - name: Build DEB and RPM packages without publishing
      uses: goreleaser/goreleaser-action@v7
      with:
        version: v2.18.3
        args: release --snapshot --clean
    - name: Install package inspection tools
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm
    - name: Verify native packages and release assets
      run: bash .github/scripts/package-check.sh dist

  release:
    runs-on: ubuntu-24.04
    needs: [test, test-dashboard, test-avc, release-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    permissions:
      contents: write
    # Queue releases instead of replacing pending commits when pushes overlap.
    concurrency:
      group: releases-${{ github.repository }}
      cancel-in-progress: false
      queue: max

    steps:
    - name: Checkout the tested commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Compute date-based release version
      id: version
      shell: bash
      run: |
        tag=$(bash .github/scripts/release-version.sh "$GITHUB_SHA")
        printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

    - name: Check whether this commit is already published
      id: existing
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      shell: bash
      run: |
        if draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
          --jq '.draft' 2> "$RUNNER_TEMP/release-error"); then
          if [ "$draft" = false ]; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
        elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-error"; then
          cat "$RUNNER_TEMP/release-error" >&2
          exit 1
        fi

    - name: Set up Go
      if: steps.existing.outputs.published != 'true'
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Create or reuse the commit's release tag
      if: steps.existing.outputs.published != 'true'
      env:
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      shell: bash
      run: |
        if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
        else
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
        fi
        git push origin "refs/tags/$RELEASE_TAG"

    - name: Build DEB and RPM packages and upload draft release
      if: steps.existing.outputs.published != 'true'
      uses: goreleaser/goreleaser-action@v7
      with:
        version: v2.18.3
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}

    - name: Publish completed release
      if: steps.existing.outputs.published != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      run: gh release edit "$RELEASE_TAG" --draft=false --latest=false

    - name: Promote the current main commit to latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.version.outputs.tag }}
      shell: bash
      run: |
        # Reruns of older commits must not replace a newer latest release.
        git fetch --no-tags origin refs/heads/main
        if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
          echo 'A newer commit is on main; keeping the existing latest release.'
          exit 0
        fi
        gh release edit "$RELEASE_TAG" --latest
