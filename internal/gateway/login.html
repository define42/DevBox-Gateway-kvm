<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevBox Gateway</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/5.3.2/bootstrap.min.css">
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/1.11.3/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body class="bg-body-tertiary d-flex align-items-center justify-content-center min-vh-100 py-4">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-5 col-xl-4">
        <div class="card shadow-sm">
          <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
              <div class="brand-badge mx-auto mb-3"><i class="bi bi-boxes" aria-hidden="true"></i></div>
              <h1 class="h4 mb-1">DevBox Gateway</h1>
              <p class="text-body-secondary mb-0">Sign in to continue</p>
            </div>
            {{if .Message}}<div class="alert alert-danger mb-3" role="alert">{{.Message}}</div>{{end}}
            <form method="post" action="/login" class="mt-2">
              <input type="hidden" name="csrf" value="{{.CSRF}}">
              <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                  <input class="form-control" id="username" name="username" autocomplete="username" pattern="[A-Za-z0-9._+\-]+" maxlength="128" title="Enter your username without a domain." autocapitalize="none" spellcheck="false" required>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                  <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
                </div>
              </div>
              <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>Continue</button>
            </form>
            {{if .RequiredGroup}}
            <div class="alert alert-info mt-4 mb-0" role="note">
              <div class="small fw-semibold mb-1"><i class="bi bi-people me-1" aria-hidden="true"></i>The following groups give access:</div>
              <ul class="small mb-0 ps-4"><li>{{.RequiredGroup}}</li></ul>
            </div>
            {{end}}
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
